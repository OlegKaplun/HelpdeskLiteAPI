services:
  app:
    container_name: helpdesk-lite-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./src:/var/www
    depends_on:
      - db

  nginx:
    container_name: helpdesk-lite-nginx
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    container_name: helpdesk-lite-db
    image: mysql:8.0
    ports:
      - "3306:3306"
    env_file:
      - ./docker/env/mysql.env
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data: